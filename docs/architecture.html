<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eduHarness 架構地圖</title>
<style>
  :root{
    --bg:#fbfaf8; --surface:#fff; --ink:#1c1a17; --ink-dim:#6b6459;
    --line:#ddd6cb; --accent:#b4530a; --accent-soft:#fdf1e6;
    --node:#fff; --node-edit:#eef6ee; --node-edit-line:#a8c9a8;
    --node-lock:#f4f1ec; --node-lock-line:#cfc7b8;
    --node-people:#eef2fa; --node-people-line:#a9bdd9;
    --code-bg:#f2efe9;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17161a; --surface:#201f24; --ink:#eceaf0; --ink-dim:#a29daa;
      --line:#3a3742; --accent:#ff9d4d; --accent-soft:#33251a;
      --node:#26242b; --node-edit:#1f2b22; --node-edit-line:#3f6144;
      --node-lock:#232128; --node-lock-line:#403c48;
      --node-people:#1e2430; --node-people-line:#3d4d66;
      --code-bg:#2b2932;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
       line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:32px 20px 80px}
  header h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:-.01em}
  header p{margin:0;color:var(--ink-dim);font-size:.95rem}

  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 10px}
  .tab{font:inherit;font-size:.9rem;padding:8px 16px;border-radius:9px;cursor:pointer;
       background:transparent;border:1px solid var(--line);color:var(--ink-dim)}
  .tab:hover{border-color:var(--accent);color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);
       color:var(--accent);font-weight:700}
  .aud{border:1px solid var(--line);border-radius:11px;padding:13px 16px;margin:0 0 14px;
       font-size:.85rem;line-height:1.65;background:var(--surface)}
  .aud .row{margin:0 0 7px}
  .aud .row:last-child{margin:0}
  .aud .who{display:inline-block;min-width:4.6em;font-weight:700;color:var(--accent)}
  .aud .row.maint .who{color:var(--ink-dim)}
  .aud code{font-size:.82em}

  .mapbox{overflow-x:auto;border:1px solid var(--line);border-radius:14px;
          background:var(--surface);padding:8px}
  svg{display:block;width:100%;min-width:700px;height:auto}
  .view[hidden]{display:none}

  .node{cursor:pointer}
  .node rect.card{fill:var(--node);stroke:var(--line);stroke-width:1.5;rx:12}
  .node.editable rect.card{fill:var(--node-edit);stroke:var(--node-edit-line)}
  .node.locked   rect.card{fill:var(--node-lock);stroke:var(--node-lock-line);stroke-dasharray:5 4}
  .node.people   rect.card{fill:var(--node-people);stroke:var(--node-people-line)}
  .node:hover rect.card,.node:focus rect.card{stroke:var(--accent);stroke-width:2.5}
  .node.active rect.card{stroke:var(--accent);stroke-width:2.5;filter:url(#glow)}
  .node:focus{outline:none}
  .t-title{font-size:15.5px;font-weight:700;fill:var(--ink)}
  .t-small{font-size:13.5px;font-weight:700;fill:var(--ink)}
  .t-sub{font-size:12.5px;fill:var(--ink-dim)}
  .t-mono{font-size:12.5px;fill:var(--ink-dim);font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
  .t-path{font-size:14px;font-weight:700;fill:var(--ink);font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
  .t-num{font-size:12px;font-weight:700;fill:var(--accent)}
  .t-zone{font-size:12px;fill:var(--ink-dim);letter-spacing:.08em}
  .t-edge{font-size:12px;fill:var(--ink-dim)}
  .edge{stroke:var(--ink-dim);stroke-width:1.6;fill:none;opacity:.65}
  .edge .dash{stroke-dasharray:5 4}
  .sub rect{fill:none;stroke:var(--node-lock-line);stroke-width:1.2;rx:8}
  .divider{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}

  .panel{margin-top:22px;border:1px solid var(--line);border-radius:14px;
         background:var(--surface);padding:22px 24px;min-height:210px}
  .panel h2{margin:0 0 4px;font-size:1.18rem}
  .tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:20px;
       border:1px solid var(--line);color:var(--ink-dim);margin:0 0 14px}
  .tag.edit{background:var(--node-edit);border-color:var(--node-edit-line)}
  .tag.lock{background:var(--node-lock)}
  .panel p{margin:0 0 12px}
  .panel ul{margin:0 0 12px;padding-left:1.2em}
  .panel li{margin-bottom:5px}
  .q{font-weight:700;color:var(--accent);margin-top:16px}
  code,pre{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.86rem}
  code{background:var(--code-bg);padding:1px 5px;border-radius:4px}
  pre{background:var(--code-bg);padding:12px 14px;border-radius:9px;overflow-x:auto;margin:0 0 12px}
  pre code{background:none;padding:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
  .chip{font-size:.78rem;padding:3px 10px;border-radius:20px;
        background:var(--accent-soft);border:1px solid var(--line);color:var(--ink)}
  .chip.gen{background:transparent}
  .grp{font-size:.8rem;color:var(--ink-dim);margin:10px 0 2px}
  table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:.85rem}
  th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  th{color:var(--ink-dim);font-weight:600}
  .note{border:1px solid var(--line);border-radius:11px;background:var(--accent-soft);
        padding:12px 16px;margin:16px 0 0;font-size:.85rem;color:var(--ink)}
  footer{margin-top:20px;font-size:.8rem;color:var(--ink-dim)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>eduHarness 架構地圖</h1>

</header>

<div class="note">

</svg>
</div>

<div class="view" id="v2" hidden>
<svg viewBox="0 0 920 470" role="group" aria-label="Brain 記憶層架構圖">
  <text class="t-zone" x="40" y="26">每次啟動都讀 — 固定佔用 AI 的思考空間</text>
  <g class="edge">
    <path d="M420,80 H452" marker-end="url(#ah)"/>

</div>

</div>

<div class="panel" id="panel" aria-live="polite"></div>

<footer>手冊首頁見 <code>docs/index.md</code>。這張圖的文字版說明在 <code>docs/explanation/</code> 與 <code>docs/reference/folders.md</code>。</footer>

</div>

<script>
var AUD = {
  v1:{
    t:'這一頁就是你 clone 到的<b>全部</b>。看懂第一排 ①②③ 就能開始用，其餘是想改技能時才需要的。',
    m:'兩份投影（<code>.claude/skills</code>、<code>.agents/skills</code>）由 <code>brain/skills</code> 自動生成，逐位元組相同。改技能只改正本，見 <code>docs/how-to/edit-a-skill.md</code>。'
  },
  v2:{
    t:'這些記憶層資料夾<b>已經在你的 copy 裡</b>，預設是空的，供你累積自己的規則與經驗。技能裡那些「資料不足就停下來」的規則，就是這樣一條條固化來的。',
    m:'重點不是幾個資料夾，是<b>「啟動載入 vs 觸發載入」的分界</b>：這是思考空間的預算設計，也是 instincts 那條 200 行硬上限的由來。詳見 <code>docs/explanation/brain-memory.md</code>。'
  }
};
function renderAud(v){
  var a = AUD[v];
  scopeEl.innerHTML =
    '<div class="row"><span class="who">給教師</span>' + a.t + '</div>' +
    '<div class="row maint"><span class="who">給進階</span>' + a.m + '</div>';
}

var DATA = {
intro:{title:"點任一方塊開始",html:'\
  <p>兩個分頁分別回答兩種問題：</p>\
  <ul>\
    <li><b>技能怎麼被載入</b> — 同一個技能為什麼有三份資料夾？我要改哪一份？</li>\
    <li><b>Brain</b> — 那幾個記憶層資料夾是幹嘛的，我該往裡面放什麼？</li>\
  </ul>\
  <p>只想用技能、不想懂結構的話，看懂第一分頁的第一排（①②③）就夠了。</p>'},

you:{title:"① 你 — 用一句話說出你要什麼",html:'\
  <p>不需要背任何指令。用平常講話的方式描述你要什麼就好。</p>\
  <pre><code>幫我把這份自然科課綱出 20 題選擇題，\n四選一、附答案與解析，六年級程度。</code></pre>\
  <p class="q">講清楚這四件事，就不會被反問</p>\
  <ul>\
    <li>學段年級（六年級／國二）</li>\
    <li>科目與教材範圍（哪一課、哪份檔案）</li>\
    <li>數量或節數（20 題／兩節課）</li>\
    <li>交付格式（Word／Markdown／表格）</li>\
  </ul>\
  <p>缺件時技能會停下來列出缺什麼，<b>不會自己編</b>——這是刻意設計的停止規則。</p>'},

ai:{title:"② AI 助理 — 自動挑技能",tag:"Claude Code / Codex",html:'\
  <p>用 Claude Code 或 Codex 開啟 eduHarness 資料夾後，它會掃描技能清單，\
     依你那句話的內容自動判斷該載入哪個技能。</p>\
  <p class="q">你不用手動選</p>\
  <p>「出題」會命中<b>試題命題</b>，「把這個教案改成三個層次」會命中<b>教案差異化教學</b>。\
     想強制指定也可以，直接說「用教案差異化」。</p>\
  <p class="q">它看得到什麼</p>\
  <p>AI 只讀得到 <b>④ 投影層</b>，讀不到 <code>brain/skills</code>。\
     所以你改了正本卻忘了重新投影，AI 用的還會是舊版。</p>'},

out:{title:"③ 產出 — 不是一段文字，是一組檔案",html:'\
  <p>每個技能都有「輸出契約」，規定必須交出哪些檔案。以<b>教案撰寫</b>為例：</p>\
  <div class="chips">\
    <span class="chip gen">context-brief.md</span>\
    <span class="chip gen">objective-activity-assessment-matrix.md</span>\
    <span class="chip gen">differentiation-plan.md</span>\
    <span class="chip gen">assessment-rubric.md</span>\
    <span class="chip gen">lesson-plan-draft.md</span>\
    <span class="chip gen">review-report.md</span>\
  </div>\
  <p class="q">它會在這些時候停下來</p>\
  <ul>\
    <li>資料不足 → 只輸出 <code>intake-gap.md</code>，不硬生成教案</li>\
    <li>沒指定年度／地方模板 → 產通用版並標「待確認」，不冒充官方格式</li>\
    <li>涉及學生個資、對外發布、正式送件 → 停下來等你核准</li>\
  </ul>'},

proj:{title:"④ 投影層 — AI 實際讀的地方",tag:"自動生成 · 禁止編輯",tagClass:"lock",html:'\
  <p class="q">為什麼同一個技能有三份？</p>\
  <p>一份正本（<code>brain/skills</code>）＋兩份投影。投影要兩份，是因為兩家 AI 規定的路徑不一樣：\
     Claude Code 只認 <code>.claude/skills</code>，Codex 只認 <code>.agents/skills</code>。\
     這三份是<b>逐位元組相同的內容</b>，不是三個版本。</p>\
  <p class="q">為什麼不能直接改這裡</p>\
  <ul>\
    <li>下次投影會整份覆蓋掉你的修改</li>\
    <li>內容雜湊（SHA-256）跟帳本對不上，防重腳本會直接擋住後續操作</li>\
  </ul>\
  <p>要改技能，去 <b>⑤ brain/skills</b>。細節見 <code>docs/explanation/why-three-copies.md</code>。</p>'},

brain:{title:"⑤ brain/skills — 正本",tag:"唯一可編輯處",tagClass:"edit",html:'\
  <p>18 個技能都住在這裡。一個技能 = 一個資料夾，核心是 <code>SKILL.md</code>，\
     固定六段：定位、觸發與反觸發、必要輸入、執行流程、輸出契約、停止規則。</p>\
  <div class="grp">教育類</div>\
  <div class="chips">\
    <span class="chip">教案撰寫</span><span class="chip">教案差異化教學</span>\
    <span class="chip">數位學習精進教案</span><span class="chip">試題命題</span>\
    <span class="chip">教材轉闖關遊戲</span><span class="chip">美工與分鏡設計</span>\
    <span class="chip">圖片轉 3D</span><span class="chip">Pixel AI 美術提示詞祕書</span>\
  </div>\
  <div class="grp">寫作與互動</div>\
  <div class="chips">\
    <span class="chip">AI 文件 Markdown 轉換</span><span class="chip">海明威寫作法</span>\
    <span class="chip">行動優先輸出</span><span class="chip">提示詞優化</span>\
  </div>\
  <div class="grp">通用工程</div>\
  <div class="chips">\
    <span class="chip gen">API 與介面設計</span><span class="chip gen">安全與強化</span>\
    <span class="chip gen">規格驅動開發</span><span class="chip gen">測試驅動開發</span>\
    <span class="chip gen">除錯與錯誤恢復</span><span class="chip gen">任務規劃與分解</span>\
  </div>\
  <p class="q">改完一定要重新投影</p>\
  <pre><code>node harness/scripts/project-skills.mjs                         # 先預覽\nnode harness/scripts/project-skills.mjs --apply --allow-update  # 確認後才執行</code></pre>\
  <p>完整步驟見 <code>docs/how-to/edit-a-skill.md</code>。</p>'},

gov:{title:"⑥ 治理層 — 帳本與防重",tag:"跑指令，不用手改",html:'\
  <p class="q">skill-registry.json ｜ 帳本</p>\
  <p>記錄每個技能的正本路徑、SHA-256 雜湊、兩邊投影狀態、繁中顯示名稱。\
     分享版用 <code>workspace_mode: repository-root</code>，不會存到某台電腦的絕對路徑，\
     所以 clone 到哪裡都能跑。</p>\
  <p class="q">check-skill-dedup.mjs ｜ 守門員</p>\
  <p>任何技能新增、匯入、更新前先跑它；沒印出 <code>SKILL_PROJECTION_READY</code> 就停手。</p>\
  <pre><code>node harness/scripts/check-skill-dedup.mjs --require-ready</code></pre>\
  <p>指令全貌見 <code>docs/reference/commands.md</code>。</p>'},

startup:{title:"啟動序列 — 治理三件套",tag:"每次對話必讀",html:'\
  <p>每次對話開始，AI 一定會依序讀這幾份：<code>AGENTS.md</code>（規矩）、\
     <code>brain/SKILL.md</code>（什麼情況讀哪一層）、以及 <code>brain/instincts/</code> 全部。</p>\
  <p class="q">為什麼這些必須短</p>\
  <p>它們是<b>固定成本</b>：不管你這次問什麼，這些字都會先佔掉 AI 的思考空間。\
     把細節塞進這裡，等於每一次對話都付一次錢。細節該放到觸發式的那幾層。</p>'},

instincts:{title:"brain/instincts/ — 反射動作",tag:"硬上限 200 行",tagClass:"edit",html:'\
  <p>短小、跨任務、反覆適用的規則。不分任務類型，<b>整個目錄每次啟動全量載入</b>。\
     預設是空的，你可以放自己的規則。</p>\
  <p class="q">為什麼要設 200 行上限</p>\
  <p>instincts 是唯一「無條件佔用思考空間」的層。不設上限，它會隨時間慢慢吃掉\
     整場對話可用的空間，而且是無聲地吃——你只會覺得 AI 後來變笨。\
     超過上限就必須合併或淘汰。</p>'},

bskills:{title:"brain/skills/ — 可執行的流程契約",tag:"觸發才載入",tagClass:"edit",html:'\
  <p>就是第一分頁那 18 個技能。跟其他記憶層的差別：<b>skills 是拿來執行的，不是拿來參考的</b>。</p>\
  <p class="q">一次只載入一個</p>\
  <p>依任務觸發，只讀主要那一個，必要時才讀相鄰的。18 份全載進來，等於還沒開始工作就先燒掉大半思考空間。</p>'},

kb:{title:"brain/knowledge-base/ — 耐久知識",tag:"觸發才載入 · 預設空",tagClass:"edit",html:'\
  <p>經審核、可重用的事實與結論。門檻是「<b>可重用且已驗證</b>」——兩個條件都成立才放進來。</p>\
  <p class="q">跟 skills 的差別</p>\
  <p>skills 回答「這件事怎麼做」，knowledge-base 回答「這件事的事實是什麼」。一個是流程，一個是內容。</p>\
  <p>任何記憶層都不放：secrets、tokens、密碼、私鑰、學生個資。</p>'},

errorlog:{title:"brain/errorLog/ — 同一個坑不踩第二次",tag:"讀也寫 · 預設空",tagClass:"edit",html:'\
  <p>已<b>驗證過</b>的失敗、根因，以及一條 Do Not Repeat。重點在「已驗證」：\
     猜測的原因不能寫進來，否則下次會照著錯誤的結論避錯路。</p>\
  <p class="q">這層是雙向的</p>\
  <p>任務中被觸發載入（避免重蹈覆轍），任務後被回寫（把新的坑記下來）。\
     複製 <code>TEMPLATE.md</code> 開新檔即可。</p>'},

experience:{title:"brain/experience/ — 拆解回顧",tag:"任務後回寫 · 預設空",tagClass:"edit",html:'\
  <p>做完夠大的工作後填一份回顧：這次怎麼拆的、哪裡拆錯了、成功的部分是什麼。</p>\
  <p class="q">跟 errorLog 的差別</p>\
  <p>errorLog 記「什麼壞了、根因是什麼」；experience 記「我當初怎麼想的、\
     那個判斷哪裡不對」。前者修行為，後者修判斷方式。</p>\
  <p>瑣碎、唯讀、純問答的任務不用填——這是建議性習慣，不是關卡。</p>'},

wiki:{title:"brain/wiki-index.md — 索引",html:'\
  <p>新增 <code>brain/</code> 底下任何檔案後，在這裡補一行索引。目錄一多，沒索引等於沒有。</p>\
  <p>技能清單以 <code>harness/config/skill-registry.json</code> 為準，不在索引裡重複列。</p>'}
};

var panel = document.getElementById('panel');
var scopeEl = document.getElementById('scope');

function render(k){
  var d = DATA[k] || DATA.intro;
  panel.innerHTML = '<h2>' + d.title + '</h2>' +
    (d.tag ? '<span class="tag ' + (d.tagClass||'') + '">' + d.tag + '</span>' : '') + d.html;
}
document.querySelectorAll('.node').forEach(function(n){
  function pick(){
    document.querySelectorAll('.node').forEach(function(x){ x.classList.remove('active'); });
    n.classList.add('active');
    render(n.dataset.k);
  }
  n.addEventListener('click', pick);
  n.addEventListener('keydown', function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); }
  });
});
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected','false'); });
    t.setAttribute('aria-selected','true');
    document.querySelectorAll('.view').forEach(function(v){ v.hidden = (v.id !== t.dataset.view); });
    document.querySelectorAll('.node').forEach(function(x){ x.classList.remove('active'); });
    renderAud(t.dataset.view);
    render('intro');
  });
});
renderAud('v1');
render('intro');
</script>
